# ~/.config/tmux/tmux.conf

# ─── Server / Session Options ─────────────────────────────────────────────
set-option -g mouse on
# Wheel scroll: pass through to mouse-aware apps; otherwise enter copy mode
# with -e (auto-exit when scrolling back to bottom)
bind -T root WheelUpPane if -Ft= '#{?pane_in_mode,1,#{mouse_any_flag}}' 'send-keys -M' "if -Ft= '#{alternate_on}' 'send-keys -M' 'copy-mode -et='"
bind -T root WheelDownPane select-pane -t= \; send-keys -M
set -g allow-passthrough on
setw -g monitor-activity on
setw -g monitor-silence 1
set -g visual-silence off
set -g base-index 1
set -g renumber-windows on
set -g default-terminal "tmux-256color"
set -g escape-time 0
set -g repeat-time 2000
set -g popup-border-style "fg=#fab387"
set -g message-style "bg=#000000,fg=#00ff00,bold"
set -g message-command-style "bg=#000000,fg=#00ff00,bold"
setw -g mode-keys vi

# ─── Prefix ───────────────────────────────────────────────────────────────
set -g prefix `
unbind C-b
bind ` send-prefix

# ─── Cleanup (tmux defaults + previous custom bindings) ───────────────────
unbind '"'
unbind '%'
unbind s
unbind w
unbind v
unbind M
unbind ,
unbind .
unbind r
unbind p
unbind x
unbind D
unbind B
unbind H
unbind J
unbind K
unbind L
unbind q
unbind Q
unbind '!'
unbind Escape
unbind -aq -T open
unbind -aq -T resize
unbind -aq -T o-mode
unbind -aq -T s-mode
unbind -aq -T m-mode
unbind -aq -T r-mode
unbind -aq -T rs-mode
unbind -aq -T rn-mode
unbind -aq -T rm-mode
unbind -aq -T scroll
unbind -aq -T scroll-g
unbind -aq -T view
unbind -aq -T view-g
unbind -aq -T w-nav

# ─── Split ────────────────────────────────────────────────────────────────
bind '-' splitw -v -c '#{pane_current_path}'
bind '_' splitw -fv -c '#{pane_current_path}'
bind '\' splitw -h -c '#{pane_current_path}'
bind '|' splitw -fh -c '#{pane_current_path}'

# ─── Single-key actions ───────────────────────────────────────────────────
bind t new-window
bind H previous-window \; switch-client -T w-nav
bind L next-window \; switch-client -T w-nav
bind -T w-nav H previous-window \; switch-client -T w-nav
bind -T w-nav L next-window \; switch-client -T w-nav
bind -T w-nav q display-message ""
bind -T w-nav Escape display-message ""
bind c copy-mode
bind q display-message ""
# Popups: -B and fzf draws the box below a blank top row. With status on top, tmux protects a popup's rows
# one row too low when a pane redraws (synchronized output), so a border drawn by tmux loses its top edge
bind ? display-popup -B -w 80% -h 80% -x C -y C -E "fzf --reverse --prompt='Keybindings: ' --margin=1,0,0,0 --border=rounded --color=border:#89b4fa < ~/.config/tmux/keybindings.txt"
bind : display-popup -B -w 80% -h 5 -x C -y C -E "cmd=\$(printf '' | fzf --print-query --prompt=': ' --no-info --no-separator --margin=1,0,0,0 --border=rounded --color=border:#89b4fa --bind 'esc:abort' | head -1); [ -n \"\$cmd\" ] && eval \"tmux \$cmd\""
bind p display-popup -B -w 80% -h 5 -x C -y C -d "#{pane_current_path}" -E "label=\$(pwd | sed \"s|^\$HOME|~|\"); cmd=\$(printf '' | fzf --print-query --prompt='\$ ' --info=hidden --no-separator --margin=1,0,0,0 --border=rounded --border-label=\" \$label \" --border-label-pos=2 --color=border:#89b4fa,label:#89b4fa --bind 'esc:abort' | head -1); [ -n \"\$cmd\" ] && { out=\$(zsh -ic \"\$cmd\" 2>&1); code=\$?; if [ \$code -ne 0 ]; then first=\$(printf '%s' \"\$out\" | head -1); tmux display-message -d 0 \"#[fg=#f38ba8,bold]✗ \$cmd [exit \$code] \$first\"; fi; }"

# ─── View Mode (TUI page nav + tmux scrollback) ───────────────────────────
# alt-screen TUI (Claude Code/nvim/less): pass key through, chain in view
# normal pane (shell): enter tmux copy mode + scroll, chain in view
bind u if -F '#{alternate_on}' 'send-keys PPage ; switch-client -T view' 'copy-mode -u ; switch-client -T view'
bind d if -F '#{alternate_on}' 'send-keys NPage ; switch-client -T view' 'copy-mode ; send-keys -X page-down ; switch-client -T view'
bind k if -F '#{alternate_on}' 'send-keys M-k ; switch-client -T view'   'copy-mode ; send-keys -X cursor-up ; switch-client -T view'
bind j if -F '#{alternate_on}' 'send-keys M-j ; switch-client -T view'   'copy-mode ; send-keys -X cursor-down ; switch-client -T view'
bind G if -F '#{alternate_on}' 'send-keys C-End ; switch-client -T view' 'copy-mode ; send-keys -X history-bottom ; switch-client -T view'
bind g switch-client -T view-g
# view table (chain):
bind -T view u if -F '#{alternate_on}' 'send-keys PPage ; switch-client -T view' 'send-keys -X page-up ; switch-client -T view'
bind -T view d if -F '#{alternate_on}' 'send-keys NPage ; switch-client -T view' 'send-keys -X page-down ; switch-client -T view'
bind -T view k if -F '#{alternate_on}' 'send-keys M-k ; switch-client -T view'   'send-keys -X cursor-up ; switch-client -T view'
bind -T view j if -F '#{alternate_on}' 'send-keys M-j ; switch-client -T view'   'send-keys -X cursor-down ; switch-client -T view'
bind -T view G if -F '#{alternate_on}' 'send-keys C-End ; switch-client -T view' 'send-keys -X history-bottom ; switch-client -T view'
bind -T view g switch-client -T view-g
bind -T view q if -F '#{pane_in_mode}' 'send-keys -X cancel' ''
bind -T view Escape if -F '#{pane_in_mode}' 'send-keys -X cancel' ''
bind -T view-g g if -F '#{alternate_on}' 'send-keys C-Home ; switch-client -T view' 'send-keys -X history-top ; switch-client -T view'

# ─── Copy Mode (vi) ───────────────────────────────────────────────────────
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ─── o-mode (open apps) ───────────────────────────────────────────────────
bind o switch-client -T o-mode
bind -T o-mode o resize-pane -Z
bind -T o-mode f display-popup -b rounded -w 100% -h 100% -S "fg=#89b4fa" -d "#{pane_current_path}" -E "filu"
bind -T o-mode k display-popup -b rounded -w 100% -h 100% -S "fg=#89b4fa" -d "#{pane_current_path}" -E "kbu"
bind -T o-mode g display-popup -b rounded -w 100% -h 100% -S "fg=#89b4fa" -d "#{pane_current_path}" -E "lazygit -sm full log"
bind -T o-mode w display-popup -b rounded -w 100% -h 100% -S "fg=#89b4fa" -d "#{pane_current_path}" -E "webu"
bind -T o-mode q display-message ""
bind -T o-mode Escape display-message ""

# ─── s-mode (search) ──────────────────────────────────────────────────────
bind s switch-client -T s-mode
bind -T s-mode w display-popup -B -w 50 -x C -y C -E "tmux list-windows -F '#I: #W' | fzf --reverse --margin=1,0,0,0 --border=rounded --color=border:#89b4fa | cut -d: -f1 | xargs tmux select-window -t"
bind -T s-mode s run-shell "zsh -c 'source ~/.config/vulcanzsh/modules/tmux-workflow.zsh && tmux_s_flow' > /dev/null 2>&1"
bind -T s-mode q display-message ""
bind -T s-mode Escape display-message ""

# ─── m-mode (move) ────────────────────────────────────────────────────────
bind m switch-client -T m-mode
bind -T m-mode i display-popup -B -w 50 -x C -y C -E "tmux list-windows -F '#{?window_active,,#I: #W}' | sed '/^$/d' | fzf --reverse --prompt='Merge pane to: ' --margin=1,0,0,0 --border=rounded --color=border:#89b4fa | cut -d: -f1 | xargs -I{} tmux join-pane -h -t {}"
bind -T m-mode o break-pane
bind -T m-mode q display-message ""
bind -T m-mode Escape display-message ""

# ─── r-mode (action namespace) ────────────────────────────────────────────
bind r switch-client -T r-mode
bind -T r-mode l source-file "$HOME/.config/tmux/tmux.conf" \; display-message "Config reloading.."
bind -T r-mode s switch-client -T rs-mode
bind -T r-mode n switch-client -T rn-mode
bind -T r-mode m switch-client -T rm-mode
bind -T r-mode q display-message ""
bind -T r-mode Escape display-message ""

# ─── rs-mode (resize, chain hjkl; V/H even layout) ────────────────────────
bind -T rs-mode h resize-pane -L 5 \; switch-client -T rs-mode
bind -T rs-mode j resize-pane -D 5 \; switch-client -T rs-mode
bind -T rs-mode k resize-pane -U 5 \; switch-client -T rs-mode
bind -T rs-mode l resize-pane -R 5 \; switch-client -T rs-mode
bind -T rs-mode V select-layout even-vertical
bind -T rs-mode H select-layout even-horizontal
bind -T rs-mode q display-message ""
bind -T rs-mode Escape display-message ""

# ─── rn-mode (rename) ─────────────────────────────────────────────────────
bind -T rn-mode w display-popup -B -h 5 -w 50 -x C -y C -E "zsh -c 'source ~/.config/vulcanzsh/modules/tmux-workflow.zsh && tmux_rename_window'"
bind -T rn-mode s display-popup -B -h 5 -w 50 -x C -y C -E "printf '' | fzf --print-query --prompt='Rename session: ' --no-info --no-separator --margin=1,0,0,0 --border=rounded --color=border:#89b4fa | head -1 | xargs -I{} tmux rename-session '{}'"
bind -T rn-mode q display-message ""
bind -T rn-mode Escape display-message ""

# ─── rm-mode (remove) ─────────────────────────────────────────────────────
bind -T rm-mode w kill-window
bind -T rm-mode p kill-pane
bind -T rm-mode q display-message ""
bind -T rm-mode Escape display-message ""

# bootstrap tpm
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreknix/tmux-primary-ip'

# config catppucin color
if-shell '[ -f ~/.config/tmux/colors.conf ]' "source-file ~/.config/tmux/colors.conf"

# status left look and feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_rosewater},fg=#{@thm_base},bold]  #S },#{#[bg=default,fg=#{@thm_rosewater},bold]  #S }}"
#set -ga status-left "#[bg=default,fg=#{@thm_overlay0},none,bold]|"
#set -ga status-left "#[bg=default,fg=#{@thm_green},bold]  #{pane_current_command} "
#set -ga status-left "#[bg=default,fg=#{@thm_overlay0},none,bold]|"
#set -ga status-left "#[bg=default,fg=#{@thm_blue},bold]   #{=/-10/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=default,fg=#{@thm_overlay0},none,bold]#{?window_zoomed_flag,|,}"
set -ga status-left "#[bg=default,fg=#{@thm_yellow},bold]#{?window_zoomed_flag,  zoom ,}"
set -ga status-left "#[bg=default,fg=#{@thm_overlay0},none,bold]#{?#{||:#{pane_in_mode},#{!=:#{client_key_table},root}},|,}"
set -ga status-left "#[bg=default,fg=#{@thm_peach},bold]#{?pane_in_mode,  copy ,#{?#{!=:#{client_key_table},root},  #{client_key_table} ,}}"

# status right look and feel
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#{?#{E:@status_ip_fit},#[bg=default#,fg=#{@thm_mauve}#,bold] 󰖩 #{primary_ip} ,}"

# Configure Tmux
set -g status-position top
set -g detach-on-destroy off
# Record a client that lost its own session: tmux moves it with an empty last session (a fresh attach looks the
# same, so client-attached clears it). session-closed shows the picker only to that client
set-hook -g "client-session-changed[10]" "set -gF @session_lost '#{?client_last_session,,#{hook_client}}'"
set-hook -g "client-attached[10]" "set -gu @session_lost"
set-hook -g session-closed "run-shell 'zsh -c \"source ~/.config/vulcanzsh/modules/tmux-workflow.zsh && tmux_on_session_close\" > /dev/null 2>&1'"
# Clear @ready flag when switching into the window (Claude-code hooks set it)
set-hook -g after-select-window "set-window-option -uq @ready"
#set -g status 2
set -g status-style "bg=default"
set -g status-justify "centre"
#set -g status-format[1] "#[align=left,bg=default,fg=#{@thm_sapphire},bold]  #{s|$HOME|~|:pane_current_path}"

# pane border look and feel
setw -g pane-border-status top
setw -g pane-border-format "\
#[align=left,fg=#{@thm_blue}]  #{s|$HOME|~|:pane_current_path} \
#[align=right,fg=#{@thm_sapphire}] #(cd #{pane_current_path} && git branch --show-current 2>/dev/null | sed 's/^/󰊢 /') \
#[fg=#{@thm_green}]\
#{?#{==:#{pane_current_command},zsh},,\
#{?#{==:#{pane_current_command},nvim},,\
#{?#{==:#{pane_current_command},filu},󰀶,\
#{?#{==:#{pane_current_command},bash},,\
#{?#{==:#{pane_current_command},ssh},,\
#{?#{==:#{pane_current_command},#(claude --version 2>/dev/null | awk '{print $1}')},󱙺,\
}}}}} \
#{pane_current_command} "
setw -g pane-border-style "bg=default,fg=#{@thm_overlay0}"
setw -g pane-active-border-style "bg=default,fg=#{@thm_blue}"
setw -g pane-border-lines double

# window content (number)
set -wg automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}"
set -g window-status-current-format "#[fg=#{@thm_sky}#,bg=default]#[fg=#{@thm_base}#,bg=#{@thm_sky}#,bold]#I#{?#{!=:#{window_name},window}, #[fg=#{@thm_text}#,bg=#{@thm_surface1}] #W#[fg=#{@thm_surface1}#,bg=default],#[fg=#{@thm_sky}#,bg=default]}"
# overflow fallback: index capsules -> bare indices -> hide IP -> tmux scrolls (status-justify centre)
# IP width is a constant: the plugin only interpolates #{primary_ip} inside status-right, so it cannot be measured
set -g @status_ip_w 18
set -g @status_left_w "#{W:,#{w:#{T:status-left}}}"
set -g @status_caps_fit "#{e|<=:#{e|+:#{w:#{W:#I___,#I__#{?#{!=:#{window_name},window},__#W,}_}},#{e|+:#{E:@status_left_w},#{@status_ip_w}}},#{client_width}}"
set -g @status_ip_fit "#{e|<=:#{e|+:#{w:#{W:#I_,#I__#{?#{!=:#{window_name},window},__#W,}_}},#{e|+:#{E:@status_left_w},#{@status_ip_w}}},#{client_width}}"
set -g window-status-format "#{?window_bell_flag,#{?#{E:@status_caps_fit},#[fg=#{@thm_red}#,bg=default]#[fg=#{@thm_base}#,bg=#{@thm_red}#,bold]#I#[fg=#{@thm_red}#,bg=default],#[fg=#{@thm_red}#,bold]#I},#{?#{==:#{@ready},on},#{?#{E:@status_caps_fit},#[fg=#{@thm_green}#,bg=default]#[fg=#{@thm_base}#,bg=#{@thm_green}#,bold]#I#[fg=#{@thm_green}#,bg=default],#[fg=#{@thm_green}#,bold]#I},#{?#{&&:#{window_activity_flag},#{!:#{window_silence_flag}}},#{?#{E:@status_caps_fit},#[fg=#{@thm_peach}#,bg=default]#[fg=#{@thm_base}#,bg=#{@thm_peach}#,bold]#I#[fg=#{@thm_peach}#,bg=default],#[fg=#{@thm_peach}#,bold]#I},#{?#{E:@status_caps_fit},#[fg=#{@thm_surface0}#,bg=default]#[fg=#{@thm_overlay1}#,bg=#{@thm_surface0}#,bold]#I#[fg=#{@thm_surface0}#,bg=default],#[fg=#{@thm_overlay1}]#I}}}}"

set -g window-status-style "bg=default,fg=#{@thm_yellow}"
set -g window-status-last-style "bg=default,fg=#{@thm_yellow}"
set -g window-status-activity-style "bg=default,fg=default"
set -g window-status-bell-style "bg=default,fg=default,bold"
set -g window-status-current-style "bg=default,fg=default,bold"
set -gF window-status-separator "#[bg=default,fg=#{@thm_overlay0}] "

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# ─── vim-tmux-navigator: remap from Ctrl+hjkl to Meta+hjkl ────────────────
# Run after tpm so we override the plugin's default Ctrl+hjkl bindings
unbind -n C-h
unbind -n C-j
unbind -n C-k
unbind -n C-l
unbind -n 'C-\'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?|fzf)(diff)?$'"
bind -n M-h if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind -n M-j if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind -n M-k if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind -n M-l if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'
bind -n 'M-\' if-shell "$is_vim" 'send-keys M-\\' 'select-pane -l'
bind -T copy-mode-vi M-h select-pane -L
bind -T copy-mode-vi M-j select-pane -D
bind -T copy-mode-vi M-k select-pane -U
bind -T copy-mode-vi M-l select-pane -R
bind -T copy-mode-vi 'M-\' select-pane -l

# >>> locku >>>
source-file -q ~/.config/locku/locku.tmux.conf  # locku: the lock, as locku's settings screen sets it
# <<< locku <<<
